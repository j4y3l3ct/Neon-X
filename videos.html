<script>
  const hamButton = document.querySelector('#menu');
const navigation = document.querySelector('.navigation');

hamButton.addEventListener('click', () => {
	navigation.classList.toggle('open');
	hamButton.classList.toggle('open');
});
  
function changeBackgroundColor(color) {
            document.body.style.backgroundColor = color;
            sessionStorage.setItem('bgColor', color);
        }

        const savedColor = sessionStorage.getItem('bgColor');
        if (savedColor) {
            document.body.style.backgroundColor = savedColor;
        }

function changeDivBackgroundColor(color) {
            const divElements = document.querySelectorAll('.target-div');
            divElements.forEach(div => {
                div.style.backgroundColor = color;
                sessionStorage.setItem('divColor', color);
            });
        }

        
        const savedDivColor = sessionStorage.getItem('divColor');
        if (savedDivColor) {
            const divElements = document.querySelectorAll('.target-div');
            divElements.forEach(div => {
                div.style.backgroundColor = savedDivColor;
            });
        }
    function changeDiv2BackgroundColor(color) {
            const navElements = document.querySelectorAll('.navigation');
            navElements.forEach(div => {
                navigation.style.backgroundColor = color;
                sessionStorage.setItem('navColor', color);
            });
        }

        
        const savednavColor = sessionStorage.getItem('navColor');
        if (savednavColor) {
            const navElements = document.querySelectorAll('.navigation');
            navElements.forEach(div => {
                navigation.style.backgroundColor = savednavColor;
            });
        }
      function changeDiv3BackgroundColor(color) {
            const divElements = document.querySelectorAll('.target-div2');
            divElements.forEach(div1 => {
                div1.style.backgroundColor = color;
                sessionStorage.setItem('div3Color', color);
            });
        }

        
        const saveddiv3Color = sessionStorage.getItem('div3Color');
        if (saveddiv3Color) {

            divElements.forEach(div1 => {
                div1.style.backgroundColor = saveddiv3Color;
            });
        }
